<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TermPlan — 安全鉴权</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f4f3ef;
      color: #333333;
      font-family: -apple-system, sans-serif;
    }

    .morandi-card {
      background-color: #fafaf9;
      border: 1px solid rgba(189, 178, 166, 0.4);
      box-shadow: 0 10px 30px rgba(138, 131, 124, 0.1);
    }

    .morandi-input {
      background-color: #f1ede7;
      border: 1px solid rgba(189, 178, 166, 0.5);
      transition: all 0.2s ease;
    }

    .morandi-input:focus {
      border-color: #7b94a1;
      background-color: #ffffff;
      outline: none;
    }

    .tab-btn {
      color: #9c958d;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      color: #2c2c2c;
      font-weight: 600;
      border-bottom-color: #829ba7;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm p-8 rounded-3xl morandi-card">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-serif text-[#2c2c2c] tracking-wide">TermPlan</h1>
      <p class="text-xs text-[#7a736c] mt-2 tracking-widest uppercase">鉴权中心 / Auth Center</p>
    </div>

    <div class="flex justify-center space-x-8 text-sm mb-6 border-b border-gray-200 pb-2">
      <button id="tab-login" class="tab-btn active pb-1" onclick="switchAuth('login')">验证登入</button>
      <button id="tab-register" class="tab-btn pb-1" onclick="switchAuth('register')">新成员接入</button>
    </div>

    <form id="authForm" onsubmit="handleAuth(event)" class="space-y-5">
      <div>
        <label class="text-[10px] font-bold text-[#7a736c] block mb-1.5 ml-1 uppercase tracking-wider">Username</label>
        <input type="text" id="username" class="morandi-input w-full rounded-xl px-4 py-3 text-sm" placeholder="输入用户名"
          required autocomplete="off">
      </div>
      <div>
        <label class="text-[10px] font-bold text-[#7a736c] block mb-1.5 ml-1 uppercase tracking-wider">Password</label>
        <input type="password" id="password" class="morandi-input w-full rounded-xl px-4 py-3 text-sm"
          placeholder="输入密匙" required>
      </div>

      <div id="messageBox" class="hidden text-xs p-3 rounded-xl text-center"></div>

      <button type="submit" id="submitBtn"
        class="w-full bg-[#829ba7] hover:bg-[#728a95] text-white text-sm font-bold py-4 rounded-xl transition-all duration-300 shadow-md">
        验证并进入工作区
      </button>
    </form>

    <p class="text-center text-[10px] text-[#9c958d] mt-8 font-mono">
      终端节点已就绪 · 构建极简复习美学
    </p>
  </div>

  <script>
    // 当前的操作状态：默认为登录
    let currentAction = 'login';

    // 切换登录和注册界面
    function switchAuth(action) {
      currentAction = action;
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const submitBtn = document.getElementById('submitBtn');
      const msgBox = document.getElementById('messageBox');

      msgBox.classList.add('hidden'); // 切换时清空提示

      if (action === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        submitBtn.innerText = '验证并进入工作区';
        submitBtn.style.backgroundColor = '#829ba7';
      } else {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        submitBtn.innerText = '部署新账户节点';
        submitBtn.style.backgroundColor = '#9ca89a'; // 注册用静谧灰绿
      }
    }

    // 处理表单提交（Ajax 异步请求）
    function handleAuth(event) {
      event.preventDefault(); // 阻止网页默认的刷新提交

      const usernameVal = document.getElementById('username').value;
      const passwordVal = document.getElementById('password').value;
      const msgBox = document.getElementById('messageBox');

      // 组装成 JSON 发送给 Flask 后端
      fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: currentAction,
          username: usernameVal,
          password: passwordVal
        })
      })
        .then(response => response.json())
        .then(data => {
          msgBox.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'bg-green-50', 'text-green-700');

          if (data.status === 'success') {
            // 显示成功提示
            msgBox.classList.add('bg-green-50', 'text-green-700');
            msgBox.innerText = data.msg;

            if (currentAction === 'login') {
              // 【核心跳转】如果是登录成功，1秒后自动切入室友做的主看板界面
              setTimeout(() => {
                window.location.href = '/';
              }, 1000);
            } else {
              // 如果是注册成功，清空表单并自动切换回登录选项卡
              document.getElementById('authForm').reset();
              setTimeout(() => { switchAuth('login'); }, 1500);
            }
          } else {
            // 显示失败提示
            msgBox.classList.add('bg-red-50', 'text-red-700');
            msgBox.innerText = data.msg;
          }
        })
        .catch(err => {
          msgBox.classList.remove('hidden');
          msgBox.classList.add('bg-red-50', 'text-red-700');
          msgBox.innerText = '⚠️ 网络握手失败，请检查后端服务';
        });
    }
  </script>
</body>

</html>
